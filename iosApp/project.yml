name: Nocturne
options:
  bundleIdPrefix: app.nocturne
  deploymentTarget:
    iOS: "16.0"
targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - target: NocturneWidget
    entitlements:
      path: iosApp/Nocturne.entitlements
      properties:
        com.apple.security.application-groups: [group.app.nocturne]
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nocturne
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Nocturne uses your local network to play with friends nearby.
        NSMicrophoneUsageDescription: Nocturne listens for a few seconds to recognise the song playing around you.
        CFBundleURLTypes:
          - CFBundleURLName: app.nocturne
            CFBundleURLSchemes: [nocturne]
        LSApplicationQueriesSchemes: [apple-magnifier, sidestore, altstore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nocturne
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework
        OTHER_LDFLAGS: ["-framework", "ComposeApp"]
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  NocturneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: iosWidget
    entitlements:
      path: iosWidget/NocturneWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.nocturne]
    info:
      path: iosWidget/Info.plist
      properties:
        CFBundleDisplayName: Nocturne
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nocturne.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
