name: Voice clip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng zip >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile
          cat > tts.py <<'PY'
          import numpy as np, soundfile as sf
          from kokoro import KPipeline
          p = KPipeline(lang_code='a')
          for v in ['af_heart', 'af_bella', 'af_sky', 'af_nicole', 'af_kore', 'af_aoede', 'af_jessica', 'af_river']:
              for i, text in enumerate(['Nocturne!', 'Noc-turne!']):
                  try:
                      parts = [a for _, _, a in p(text, voice=v, speed=0.9)]
                      sf.write(f'out/{v}-{i}.wav', np.concatenate(parts), 24000)
                      print('ok', v, i)
                  except Exception as e:
                      print('fail', v, e)
          PY
          mkdir out && python tts.py && (cd out && zip ../voice2.zip *.wav)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload promo-assets voice2.zip -R "$GITHUB_REPOSITORY" --clobber
