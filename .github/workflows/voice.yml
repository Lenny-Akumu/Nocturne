name: Voice clip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  say:
    runs-on: macos-15
    steps:
      - name: Render
        run: |
          say -v '?' | head -60
          for v in Samantha Karen Moira Tessa Ava Zoe Allison Susan Victoria; do
            say -v "$v" -r 165 -o "$v.aiff" "Nocturne!" 2>/dev/null && echo "ok $v"
          done
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          mkdir out
          for f in *.aiff; do
            ffmpeg -loglevel error -i "$f" -af "asetrate=22050*1.28,aresample=22050,atempo=0.9,silenceremove=start_periods=1:start_threshold=-45dB,areverse,silenceremove=start_periods=1:start_threshold=-45dB,areverse" -ac 1 -ar 22050 "out/${f%.aiff}.wav"
          done
          (cd out && zip ../voice.zip *.wav)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view promo-assets -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create promo-assets -R "$GITHUB_REPOSITORY" --prerelease --title "Promo assets" --notes "Assets (not an app release)."
          gh release upload promo-assets voice.zip -R "$GITHUB_REPOSITORY" --clobber
