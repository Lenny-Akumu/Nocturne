name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleRelease --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: grep -E '^(e:|w: .*deprecated)|error:|FAILURE|What went wrong' -A3 build.log | grep -v '^w:' | head -150
      - name: Rename APK
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk out/Nocturne-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-android
          path: out/Nocturne-android.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI and EXE
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageMsi :composeApp:packageExe --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
