name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in BuildInfo.kt"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -oP 'VERSION = "\K[^"]+' composeApp/src/commonMain/kotlin/app/nocturne/BuildInfo.kt)" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Minecraft font
        shell: bash
        run: |
          set +e
          json=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/IdreesInc/Monocraft/releases/latest)
          urls=$(echo "$json" | grep -o '"browser_download_url": *"[^"]*' | sed 's/.*"//')
          mkdir -p "$RUNNER_TEMP/mc" composeApp/src/androidMain/res/font composeApp/src/desktopMain/resources/fonts
          url=$(echo "$urls" | grep -iE '/Monocraft\.(ttf|otf)$' | head -1)
          if [ -n "$url" ]; then
            curl -sL "$url" -o "$RUNNER_TEMP/mc/font.${url##*.}"
          else
            zip=$(echo "$urls" | grep -iE 'ttf.*\.zip$|\.zip$' | head -1)
            [ -n "$zip" ] && curl -sL "$zip" -o "$RUNNER_TEMP/mc/f.zip" && unzip -o -q "$RUNNER_TEMP/mc/f.zip" -d "$RUNNER_TEMP/mc/x"
            f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.ttf' ! -iname '*bold*' ! -iname '*italic*' | head -1)
            [ -z "$f" ] && f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.otf' ! -iname '*bold*' | head -1)
            [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/mc/font.${f##*.}"
          fi
          src=$(ls "$RUNNER_TEMP"/mc/font.* 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            ext="${src##*.}"
            cp "$src" "composeApp/src/androidMain/res/font/monocraft.$ext"
            cp "$src" "composeApp/src/desktopMain/resources/fonts/monocraft.$ext"
            echo "Font bundled: $src"
          else
            echo "Monocraft font not found, building without it"
          fi
          exit 0
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nocturne.jks"
            echo "NOCTURNE_KEYSTORE=$RUNNER_TEMP/nocturne.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleRelease --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - name: Rename APK
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk "out/Nocturne-${{ needs.meta.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-android
          path: out/*.apk

  windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Minecraft font
        shell: bash
        run: |
          set +e
          json=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/IdreesInc/Monocraft/releases/latest)
          urls=$(echo "$json" | grep -o '"browser_download_url": *"[^"]*' | sed 's/.*"//')
          mkdir -p "$RUNNER_TEMP/mc" composeApp/src/androidMain/res/font composeApp/src/desktopMain/resources/fonts
          url=$(echo "$urls" | grep -iE '/Monocraft\.(ttf|otf)$' | head -1)
          if [ -n "$url" ]; then
            curl -sL "$url" -o "$RUNNER_TEMP/mc/font.${url##*.}"
          else
            zip=$(echo "$urls" | grep -iE 'ttf.*\.zip$|\.zip$' | head -1)
            [ -n "$zip" ] && curl -sL "$zip" -o "$RUNNER_TEMP/mc/f.zip" && unzip -o -q "$RUNNER_TEMP/mc/f.zip" -d "$RUNNER_TEMP/mc/x"
            f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.ttf' ! -iname '*bold*' ! -iname '*italic*' | head -1)
            [ -z "$f" ] && f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.otf' ! -iname '*bold*' | head -1)
            [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/mc/font.${f##*.}"
          fi
          src=$(ls "$RUNNER_TEMP"/mc/font.* 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            ext="${src##*.}"
            cp "$src" "composeApp/src/androidMain/res/font/monocraft.$ext"
            cp "$src" "composeApp/src/desktopMain/resources/fonts/monocraft.$ext"
            echo "Font bundled: $src"
          else
            echo "Monocraft font not found, building without it"
          fi
          exit 0
      - name: Bundle libVLC
        shell: pwsh
        run: |
          $ver = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$ver/win64/vlc-$ver-win64.zip" -OutFile "$env:RUNNER_TEMP\vlc.zip"
          Expand-Archive "$env:RUNNER_TEMP\vlc.zip" -DestinationPath "$env:RUNNER_TEMP\vlc"
          $src = "$env:RUNNER_TEMP\vlc\vlc-$ver"
          $dst = "composeApp\resources\windows\vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src\libvlc.dll", "$src\libvlccore.dll" $dst
          Copy-Item "$src\plugins" "$dst\plugins" -Recurse
          foreach ($d in "gui","video_splitter","visualization","lua","services_discovery","control","spu","text_renderer","stream_out","mux","d3d9","d3d11","keystore") {
            Remove-Item -Recurse -Force "$dst\plugins\$d" -ErrorAction SilentlyContinue
          }
          # Rebuild the plugin cache after pruning: effect toggles recreate the libVLC instance, a stale cache forces a full rescan.
          if (Test-Path "$src\vlc-cache-gen.exe") { & "$src\vlc-cache-gen.exe" "$dst\plugins"; $global:LASTEXITCODE = 0 }
          if (-not (Test-Path "$dst\plugins\audio_filter\libkaraoke_plugin.dll")) { Write-Host "warning: audio_filter plugins missing" }
          "{0:N1} MB bundled" -f ((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build app image
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:createDistributable --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - name: Smoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $p = Start-Process -FilePath "composeApp\build\compose\binaries\main\app\Nocturne\Nocturne.exe" -ArgumentList "--smoke-test=$out" -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Host "Process did not exit" }
          if (Test-Path $out) { Get-Content $out } else { Write-Host "No smoke report written" }
          if (-not (Test-Path $out) -or -not (Select-String -Path $out -Pattern "SMOKE OK" -Quiet)) { exit 1 }
      - name: Build setup with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DOutDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\nocturne.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-windows
          path: dist/*

  ios:
    name: iOS app
    needs: meta
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Kotlin framework
        run: |
          set -o pipefail
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - name: Fetch Minecraft font
        shell: bash
        run: |
          set +e
          json=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/IdreesInc/Monocraft/releases/latest)
          urls=$(echo "$json" | grep -o '"browser_download_url": *"[^"]*' | sed 's/.*"//')
          mkdir -p "$RUNNER_TEMP/mc"
          url=$(echo "$urls" | grep -iE '/Monocraft\.(ttf|otf)$' | head -1)
          if [ -n "$url" ]; then
            curl -sL "$url" -o "$RUNNER_TEMP/mc/font.${url##*.}"
          else
            zip=$(echo "$urls" | grep -iE 'ttf.*\.zip$|\.zip$' | head -1)
            [ -n "$zip" ] && curl -sL "$zip" -o "$RUNNER_TEMP/mc/f.zip" && unzip -o -q "$RUNNER_TEMP/mc/f.zip" -d "$RUNNER_TEMP/mc/x"
            f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.ttf' ! -iname '*bold*' ! -iname '*italic*' | head -1)
            [ -z "$f" ] && f=$(find "$RUNNER_TEMP/mc" -iname 'Monocraft*.otf' ! -iname '*bold*' | head -1)
            [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/mc/font.${f##*.}"
          fi
          src=$(ls "$RUNNER_TEMP"/mc/font.* 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            cp "$src" "iosApp/iosApp/monocraft.${src##*.}"
            echo "Font bundled: $src"
          else
            echo "Monocraft font not found, building without it"
          fi
          exit 0
      - name: Build app
        run: |
          set -o pipefail
          brew install xcodegen
          cd iosApp
          sed -i '' "s/MARKETING_VERSION: \"1.0.0\"/MARKETING_VERSION: \"${{ needs.meta.outputs.version }}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
          xcodebuild -project Nocturne.xcodeproj -target Nocturne -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcode.log | grep -E "error:|warning: .*ComposeApp|BUILD" || true
          test -d build/Release-iphoneos/Nocturne.app
      - name: Show Xcode errors
        if: failure()
        run: grep -E "error:" -A3 iosApp/xcode.log | head -100 || true
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R iosApp/build/Release-iphoneos/Nocturne.app out/Payload/
          cd out && zip -qry "Nocturne-${{ needs.meta.outputs.version }}-ios.ipa" Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-ios
          path: out/*.ipa
      - name: Attach IPA to the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.meta.outputs.version }}"
          for i in $(seq 1 60); do gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$tag" out/*.ipa -R "$GITHUB_REPOSITORY" --clobber
      - name: Screenshots in the iPhone simulator
        continue-on-error: true
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 -q
          cd iosApp
          xcodebuild -project Nocturne.xcodeproj -target Nocturne -configuration Release -sdk iphonesimulator ARCHS=arm64 \
            FRAMEWORK_SEARCH_PATHS="$PWD/../composeApp/build/bin/iosSimulatorArm64/releaseFramework" \
            SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { grep -E "error:" sim.log | head -40; exit 1; }
          device=$(xcrun simctl list devicetypes | grep -oE "iPhone 1[5-7] Pro \(" | head -1 | sed 's/ ($//')
          udid=$(xcrun simctl create shot "${device:-iPhone 16 Pro}")
          xcrun simctl boot "$udid"
          xcrun simctl ui "$udid" appearance dark || true
          xcrun simctl install "$udid" simbuild/Release-iphonesimulator/Nocturne.app
          mkdir -p ../shots
          for s in home search library settings player; do
            xcrun simctl terminate "$udid" app.nocturne || true
            xcrun simctl launch "$udid" app.nocturne --shot=$s
            sleep 25
            xcrun simctl io "$udid" screenshot "../shots/$s.png"
            sips -Z 420 -s format jpeg -s formatOptions 55 "../shots/$s.png" --out "../shots/$s.jpg" >/dev/null
            echo "==SHOT $s=="
            base64 -i "../shots/$s.jpg" | fold -w 120
            echo "==END $s=="
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nocturne-ios-screenshots
          path: shots/*.png
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.ipa
          tag_name: v${{ needs.meta.outputs.version }}
          name: Nocturne ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
