name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in BuildInfo.kt"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -oP 'VERSION = "\K[^"]+' composeApp/src/commonMain/kotlin/app/nocturne/BuildInfo.kt)" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nocturne.jks"
            echo "NOCTURNE_KEYSTORE=$RUNNER_TEMP/nocturne.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleRelease --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - name: Rename APK
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk "out/Nocturne-${{ needs.meta.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-android
          path: out/*.apk

  windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app image and MSI
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:createDistributable :composeApp:packageMsi --continue 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e:|error:|What went wrong' -A3 build.log | head -150
      - name: Smoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $p = Start-Process -FilePath "composeApp\build\compose\binaries\main\app\Nocturne\Nocturne.exe" -ArgumentList "--smoke-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host "No smoke report written" }
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build setup with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DOutDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\nocturne.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item composeApp\build\compose\binaries\main\msi\*.msi dist\
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-windows
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: v${{ needs.meta.outputs.version }}
          name: Nocturne ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
